name: Site build check

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-build.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-build.yml"

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check expected pages exist
        run: |
          for f in index.html projects/index.html contact/index.html 404.html; do
            test -s "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done
