# nginx for the homelab copy of bvrinfra.in (#101). Mirrors site/public/_headers, which
# Cloudflare Pages applies to the fallback copy, so both origins send the same headers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Behind the tunnel and the Worker, redirects must stay relative (no http://, no :8080).
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Pages are never cached: every visit gets the current build (Ravi, 17 Oct: real-time data).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Served-By "homelab" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Fingerprinted build assets: the file name changes when the content does.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Served-By "homelab" always;
    }

    # Liveness and readiness for Kubernetes; not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Served-By "homelab" always;
        internal;
    }
}
