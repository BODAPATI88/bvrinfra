name: Site build check

# Runs on every PR (no path filter) so it can be a required check:
# a required check that skips never reports, and the PR could never merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check expected pages exist
        run: |
          for f in index.html projects/index.html contact/index.html skills/index.html log/index.html writing/september-2026-outage/index.html 404.html; do
            test -s "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done
