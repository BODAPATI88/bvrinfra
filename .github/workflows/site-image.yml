name: Site image

# Builds the site as a container image for the homelab origin (#101) and tests the
# front-door Worker. On pull requests: build and test only. On main: also push to GHCR,
# tagged with the commit and `main`; the homelab pulls `main` and rolls out new digests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Worker failover tests
        run: node --test infra/worker/test/index.test.mjs

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (main only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          build-args: SITE_COMMIT_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/bodapati88/bvrinfra-site:main
            ghcr.io/bodapati88/bvrinfra-site:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
