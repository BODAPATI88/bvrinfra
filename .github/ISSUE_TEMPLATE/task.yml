name: Task
description: One piece of work with a single owner and a clear finish line
labels: []
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable outcomes. Someone else should be able to tell whether it's finished.
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      description: Add the matching owner label too.
      options:
        - Claude (code, infra, PRs)
        - Gemini (long-form drafts)
        - ChatGPT (review, short copy)
        - Ravi (decisions, dashboards, facts)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, constraints, what this is blocked on.
